[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mica-conversational-doll"
version = "0.1.0"
description = "Offline conversational doll software for MICA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
]

[project.scripts]
mica = "mica.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
